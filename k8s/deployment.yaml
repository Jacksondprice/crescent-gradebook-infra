apiVersion: apps/v1
kind: Deployment
metadata:
  name: crescent-gradebook-infra
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksondprice/crescent-gradebook-infra:1.4.0
          envFrom:
            - secretRef:
                name: app-secrets
